<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Acceso restringido</title>
  <style>
    :root {
      --bg: #080b16;
      --panel: rgba(17, 23, 43, 0.82);
      --panel-strong: #151c35;
      --line: rgba(139, 157, 214, 0.24);
      --text: #f4f7ff;
      --muted: #aab5d3;
      --accent: #73e6d0;
      --accent-2: #a979ff;
      --danger: #ff748d;
      --gold: #ffd76a;
      --shadow: 0 22px 70px rgba(0, 0, 0, 0.38);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at 15% 10%, rgba(115, 230, 208, 0.16), transparent 28rem),
        radial-gradient(circle at 90% 85%, rgba(169, 121, 255, 0.17), transparent 32rem),
        linear-gradient(135deg, #070911, #10152b 55%, #080b16);
      overflow-x: hidden;
      display: grid;
      place-items: center;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0.15;
      background-image:
        linear-gradient(rgba(255,255,255,0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.04) 1px, transparent 1px);
      background-size: 34px 34px;
      mask-image: linear-gradient(to bottom, black, transparent 85%);
    }

    .app {
      width: min(520px, calc(100% - 32px));
      padding: 28px 22px 32px;
      border: 1px solid var(--line);
      border-radius: 24px;
      background: linear-gradient(145deg, rgba(24,31,58,0.9), rgba(10,14,29,0.85));
      box-shadow: var(--shadow);
      backdrop-filter: blur(18px);
      position: relative;
      z-index: 1;
    }

    .eyebrow {
      color: var(--accent);
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    h1 {
      margin: 6px 0 10px;
      font-size: clamp(1.6rem, 4.5vw, 2.4rem);
      line-height: 1.05;
      letter-spacing: -0.04em;
    }

    h1 span {
      color: var(--accent);
      text-shadow: 0 0 28px rgba(115,230,208,0.45);
    }

    .intro {
      margin: 0 0 22px;
      color: var(--muted);
      line-height: 1.6;
      font-size: 0.95rem;
    }

    .lock-form {
      display: grid;
      gap: 14px;
    }

    .digits {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }

    .digit-input {
      width: 100%;
      aspect-ratio: 1;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: rgba(255,255,255,0.03);
      color: var(--text);
      text-align: center;
      font-size: 1.8rem;
      font-weight: 800;
      outline: none;
      transition: 0.18s ease;
    }

    .digit-input:focus {
      background: rgba(115,230,208,0.12);
      box-shadow:
        inset 0 0 0 2px var(--accent),
        0 0 18px rgba(115,230,208,0.28);
      border-color: var(--accent);
    }

    .digit-input.error {
      background: rgba(255,116,141,0.18);
      border-color: var(--danger);
      color: #fff;
    }

    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 6px;
    }

    button {
      border: 0;
      border-radius: 13px;
      padding: 13px 14px;
      color: var(--text);
      background: rgba(255,255,255,0.08);
      cursor: pointer;
      font: inherit;
      font-weight: 800;
      transition: transform 0.18s ease, filter 0.18s ease, opacity 0.18s ease;
    }

    button:hover:not(:disabled) {
      transform: translateY(-2px);
      filter: brightness(1.15);
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.52;
    }

    .primary {
      color: #061313;
      background: linear-gradient(135deg, var(--accent), #b2fff0);
    }

    .secondary {
      border: 1px solid var(--line);
    }

    .status {
      min-height: 22px;
      margin-top: 10px;
      color: var(--muted);
      font-size: 0.88rem;
    }

    .status.error {
      color: var(--danger);
    }

    .status.success {
      color: var(--accent);
    }

    /* Pantalla de revelación */
    .reveal {
      display: none;
      text-align: center;
      padding: 10px 6px 6px;
    }

    .reveal h2 {
      margin: 0 0 14px;
      font-size: clamp(1.2rem, 4vw, 1.6rem);
      color: var(--accent);
      letter-spacing: -0.02em;
    }

    .reveal p {
      margin: 0;
      color: var(--text);
      line-height: 1.65;
      font-size: clamp(1rem, 3.5vw, 1.15rem);
    }

    .reveal .glow {
      color: var(--gold);
      text-shadow: 0 0 18px rgba(255,215,106,0.35);
    }

    @media (max-width: 420px) {
      .app {
        padding: 22px 16px 26px;
      }
      .digits {
        gap: 8px;
      }
      .digit-input {
        font-size: 1.5rem;
      }
      .actions {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <!-- Pantalla de bloqueo -->
    <section id="lock-screen">
      <div class="eyebrow">Acceso restringido · Nivel 09</div>
      <h1>Introduce el <span>código</span></h1>
      <p class="intro">
        Cuatro dígitos separan el misterio de la verdad. Solo la combinación correcta revelará lo que hay detrás.
      </p>

      <form class="lock-form" id="code-form" autocomplete="off">
        <div class="digits">
          <input class="digit-input" type="text" inputmode="numeric" maxlength="1" aria-label="Primer dígito" />
          <input class="digit-input" type="text" inputmode="numeric" maxlength="1" aria-label="Segundo dígito" />
          <input class="digit-input" type="text" inputmode="numeric" maxlength="1" aria-label="Tercer dígito" />
          <input class="digit-input" type="text" inputmode="numeric" maxlength="1" aria-label="Cuarto dígito" />
        </div>
        <div class="actions">
          <button type="submit" class="primary">Desbloquear</button>
          <button type="button" class="secondary" id="reset-btn">Reiniciar</button>
        </div>
        <div class="status" id="status" role="status"></div>
      </form>
    </section>

    <!-- Pantalla de revelación -->
    <section id="reveal-screen" class="reveal">
      <h2>Acceso concedido</h2>
      <p>
        El siguiente nivel se retransmite al revés en la televisión.
      </p>
    </section>
  </main>

  <script>
    const CORRECT_CODE = ['7', '8', '4', '1'];

    const form = document.getElementById('code-form');
    const inputs = [...document.querySelectorAll('.digit-input')];
    const status = document.getElementById('status');
    const resetBtn = document.getElementById('reset-btn');
    const lockScreen = document.getElementById('lock-screen');
    const revealScreen = document.getElementById('reveal-screen');

    // Auto-avance entre inputs
    inputs.forEach((input, idx) => {
      input.addEventListener('input', () => {
        input.value = input.value.replace(/[^1-9]/g, '');
        input.classList.remove('error');
        if (input.value && idx < inputs.length - 1) {
          inputs[idx + 1].focus();
        }
        status.textContent = '';
      });

      input.addEventListener('keydown', (e) => {
        if (e.key === 'Backspace' && !input.value && idx > 0) {
          inputs[idx - 1].focus();
        }
      });
    });

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const code = inputs.map(i => i.value);

      if (code.some(d => !d)) {
        status.textContent = 'Introduce los cuatro dígitos para continuar.';
        status.className = 'error';
        return;
      }

      if (code.join('') === CORRECT_CODE.join('')) {
        // Código correcto: muestra pantalla de revelación
        lockScreen.style.display = 'none';
        revealScreen.style.display = 'block';
        status.textContent = '';
        status.className = 'success';
      } else {
        // Código incorrecto
        inputs.forEach(i => i.classList.add('error'));
        status.textContent = 'Código incorrecto. La puerta permanece cerrada.';
        status.className = 'error';
        setTimeout(() => {
          inputs.forEach(i => {
            i.classList.remove('error');
            i.value = '';
          });
          inputs[0].focus();
        }, 900);
      }
    });

    resetBtn.addEventListener('click', () => {
      inputs.forEach(i => {
        i.value = '';
        i.classList.remove('error');
      });
      inputs[0].focus();
      status.textContent = '';
      status.className = '';
    });

    inputs[0].focus();
  </script>
</body>
</html>
